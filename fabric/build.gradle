plugins {
	alias(libs.plugins.fabric.loom.remap)
	alias(libs.plugins.kotlin.jvm)
	id 'maven-publish'
}

loom {
	serverOnlyMinecraftJar()

	runs {
		server {
			systemProperties.put('fabric.log.debug.level', 'trace')
		}
	}
}

repositories {}

dependencies {
	minecraft(rootProject.libs.minecraft)
	mappings loom.layered() {
		officialMojangMappings()
		parchment(variantOf(rootProject.libs.parchment) { artifactType("zip") })
	}
	modImplementation(rootProject.libs.fabric.loader)
	modImplementation(rootProject.libs.fabric.api)
	modImplementation(rootProject.libs.fabric.language.kotlin)
	implementation project(path: ':common', configuration: 'namedElements')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("${rootDir}/LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
