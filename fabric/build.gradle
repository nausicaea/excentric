import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	alias(libs.plugins.fabric.loom.remap)
	alias(libs.plugins.kotlin.jvm)
	id 'maven-publish'
}

loom {
	// Client code lives in its own source set (src/client) and is meant for debugging only (see ADR 003).
	splitEnvironmentSourceSets()

	mods {
		"excentric" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		server {
			systemProperties.put('fabric.log.debug.level', 'trace')
		}
	}
}

repositories {}

dependencies {
	minecraft(rootProject.libs.minecraft)
	mappings loom.layered() {
		officialMojangMappings()
		parchment(variantOf(rootProject.libs.parchment) { artifactType("zip") })
	}
	modImplementation(rootProject.libs.fabric.loader)
	modImplementation(rootProject.libs.fabric.api)
	modImplementation(rootProject.libs.fabric.language.kotlin)
	implementation project(path: ':common', configuration: 'namedElements')
	clientImplementation project(path: ':common', configuration: 'namedElements')
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

kotlin {
	jvmToolchain(21)
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}

	withSourcesJar()
}

// tasks.withType(JavaCompile).configureEach {
// 	it.options.release = 21
// }

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("${rootDir}/LICENSE") {
		rename { "${it}_$projectName" }
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}
