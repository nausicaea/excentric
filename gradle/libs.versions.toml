[versions]
spotbugs = '4.10.4'
gradle-spotless = '8.10.2'
gradle-spotbugs = '6.5.11'
minecraft = '1.21.4'
mixin = '0.8.7'
fabric-loom = '1.18.2'
fabric-loader = '0.19.5'
fabric-api = '0.119.4+1.21.4'
cca = '6.2.2'

[libraries]
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
cca-base = { module = "org.ladysnake.cardinal-components-api:cardinal-components-base", version.ref = "cca" }
cca-world = { module = "org.ladysnake.cardinal-components-api:cardinal-components-world", version.ref = "cca" }
cca-chunk = { module = "org.ladysnake.cardinal-components-api:cardinal-components-chunk", version.ref = "cca" }
cca-entity = { module = "org.ladysnake.cardinal-components-api:cardinal-components-entity", version.ref = "cca" }
cca-block = { module = "org.ladysnake.cardinal-components-api:cardinal-components-block", version.ref = "cca" }
cca-item = { module = "org.ladysnake.cardinal-components-api:cardinal-components-item", version.ref = "cca" }
spotbugs = { module = "com.github.spotbugs:spotbugs", version.ref = "spotbugs" }

[plugins]
gradle-spotless = { id = "com.diffplug.spotless", version.ref = "gradle-spotless" }
gradle-spotbugs = { id = "com.github.spotbugs", version.ref = "gradle-spotbugs" }
fabric-loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabric-loom" }

[bundles]
cca = [ "cca-base", "cca-world", "cca-chunk", "cca-entity", "cca-block", "cca-item" ]
