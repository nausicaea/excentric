[versions]
fabric-loom = '1.18.4'
fabric-loader = '0.20.1'
fabric-api = '0.165.0+26.4'
fabric-language-kotlin = '1.14.2+kotlin.2.4.21'
gradle-spotless = '8.10.4'
kotlin = '2.4.21'
minecraft = '1.21.4'
mixin = '0.8.7'
parchment-release = "2025.03.23"

[libraries]
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-language-kotlin = { group = "net.fabricmc", name = "fabric-language-kotlin", version.ref = "fabric-language-kotlin" }
kotlin-test = { group = "org.jetbrains.kotlin", name = "kotlin-test", version.ref = "kotlin" }
minecraft = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }
mixin = { group = "org.spongepowered", name = "mixin", version.ref = "mixin" }
parchment = { module = "org.parchmentmc.data:parchment-1.21.4", version.ref = "parchment-release" }

[plugins]
fabric-loom-remap = { id = "net.fabricmc.fabric-loom-remap", version.ref = "fabric-loom" }
gradle-spotless = { id = "com.diffplug.spotless", version.ref = "gradle-spotless" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }

[bundles]
