import com.github.spotbugs.snom.Confidence
import com.github.spotbugs.snom.Effort

plugins {
	alias(libs.plugins.gradle.spotless) apply false
	alias(libs.plugins.gradle.spotbugs) apply false
}

allprojects {
	apply plugin: rootProject.libs.plugins.gradle.spotless.get().pluginId
	apply plugin: rootProject.libs.plugins.gradle.spotbugs.get().pluginId

	group = rootProject.group
	version = rootProject.version

	repositories {
		mavenCentral()
	}

	spotless {
		java {
			target 'src/*/java/**/*.java'
			eclipse().configFile(rootProject.file('config/spotless/eclipse-formatter.xml'))
			removeUnusedImports()
			trimTrailingWhitespace()
			endWithNewline()
		}

		groovyGradle {
			target '*.gradle', '**/*.gradle'
			greclipse()
			trimTrailingWhitespace()
			endWithNewline()
		}
	}

	spotbugs {
		toolVersion = libs.versions.spotbugs
		ignoreFailures = false
		showStackTraces = false
		effort = Effort.valueOf("MAX")
		reportLevel = Confidence.valueOf("MEDIUM")
		excludeFilter = rootProject.file('config/spotbugs/filter.xml')
	}
}
