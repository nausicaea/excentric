name: dependency-submission
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  submit-gradle:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup jdk
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25.0.4+7.0.LTS'
          distribution: 'temurin'
          check-latest: 'true'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: generate and submit the dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # Regexes matched against Gradle configuration names. These keep the buildscript/plugin
          # classpath, Loom's Minecraft/mod/mappings configurations and tool classpaths out of the graph.
          dependency-graph-exclude-configurations: '^(classpath|minecraft.*|mod.*|loom.*|mappings.*|include.*|kotlin.*|spotless.*|annotationProcessor)$'
